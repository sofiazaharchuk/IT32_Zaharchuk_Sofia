<div class="page-content">
  <div *ngIf="product; else notFound" class="product-detail">
    <h1>{{ product.name }}</h1>
    <p>Виробник: {{ product.manufacturer }}</p>
    <p>{{ product.description }}</p>
  </div>

  <ng-template #notFound>
    <p class="not-found">Товар не знайдено</p>
  </ng-template>
</div>
